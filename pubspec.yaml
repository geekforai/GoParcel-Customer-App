name: customer_app
description: GoParcel Customer — Hyperlocal parcel booking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  collection: ^1.19.1
  image_picker: ^1.2.3
  http: ^1.2.2
  google_sign_in: ^6.2.2
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#011C47"
  adaptive_icon_foreground: assets/icons/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
